name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: type check
        run: mypy src
      - name: dead code
        run: vulture src --min-confidence 80
      - name: complexity
        run: radon cc src -a
      - name: tests + coverage (ratchet)
        run: pytest --cov=devops_agent --cov-report=term --cov-fail-under=80

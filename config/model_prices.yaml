# 模型单价表：成本 = 输入 token × input + 输出 token × output（单位：元 / 百万 token）。
#
# 这里不预置任何厂商价目 —— 价格随账号、地区、阶梯变化，写死一份只会在
# 界面上给出一个看起来精确、实际错了的数字。把你实际账单的单价填进 models 即可：
#
# models:
#   qwen3.8-flash:
#     input: 0.3
#     output: 1.2
#
# 未列出的模型在「成本 / 性能」页显示「未配置单价」，不计入总成本。
currency: CNY
unit_tokens: 1000000
# 兜底规则：所有没单独配置的模型都用它（不填 = 不兜底）。字段同 models 下的一项。
# default:
#   input: 0
#   output: 0
models: {}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: type check
        run: mypy src
      - name: quality gates (config/gates.yaml)
        run: python scripts/check_gates.py

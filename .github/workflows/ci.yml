name: CI

on:
  push:
    branches: [main]
  pull_request:

# 本 workflow 只读代码：显式收窄默认继承的 GITHUB_TOKEN 权限，
# 避免第三方 action / 构建脚本拿到可写 token。
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # 装依赖 + ruff/mypy + 覆盖率门禁 + 静态契约检查；无模型调用，20 分钟足够。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # 行尾门禁：.gitattributes 规定全仓库 LF；二进制文件放行。
      # `git ls-files --eol` 对自动识别的二进制给 `-text`（不是 `none`——`none` 只给
      # .gitattributes 里显式标 binary 的文件），两种都要放行，否则提交一张 png 就会被
      # 当成「行尾不是 LF」拦下。
      # 任何新文件若是 CRLF 或文件内混用，这里直接拦下，不再靠人工 review 发现。
      - name: line endings (LF only)
        run: |
          # git 在管道左侧失败时（缺仓库 / dubious ownership），没有 pipefail 就只是
          # 输出为空 → bad 为空 → 门禁静默放行。开 pipefail 让失败变成非零退出。
          set -o pipefail
          bad="$(git ls-files --eol | awk '$1 != "i/lf" && $1 != "i/none" && $1 != "i/-text" || $2 != "w/lf" && $2 != "w/none" && $2 != "w/-text"')"
          if [ -n "$bad" ]; then
            echo "::error::以下文件行尾不是 LF："
            echo "$bad"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: type check
        run: mypy src
      - name: quality gates (config/gates.yaml)
        run: python scripts/check_gates.py
      - name: eval suite validate
        # --strict：题库已达门禁量，「样本不足」这类 warning 也该阻断 ——
        # 否则题库会安静地停在 insufficient，评测一直跑但从不给结论。
        # v3 是服役题库（150 例、风险分层门禁）；v2 作为历史基线一并静态校验。
        run: |
          python -m devops_agent.eval validate --suite eval/suites/devops-core.v3.jsonl --strict
          python -m devops_agent.eval validate --suite eval/suites/devops-core.v2.jsonl --strict
      # 清单必须与题库同步：`sha256` 是 `compare` 判断「同一套题」的依据，
      # 改了 JSONL 却忘了跑 `eval manifest` 会让新旧批次的 delta 无声失效。
      # 比对 JSON 语义而非字节，避免 CRLF/缩进差异造成假红。
      - name: eval manifest in sync
        run: |
          python scripts/check_manifest_sync.py
          python scripts/check_manifest_sync.py --suite eval/suites/devops-core.v2.jsonl
      # 静态契约检查：工具名闭包 / 占位符机器无关 / 文案承诺=能力矩阵 / 题库自洽 /
      # 断言有效性 / 判卷口径版本 / 断言撞车（S7）/ 档位可达性（S8）。
      # 不跑模型，纯静态，几毫秒；S8 会真跑一次权限引擎。
      # `--known-issues` 列出已接受的存量违规（eval/lint-baseline.json）：
      # 规则对新增用例立刻生效，存量问题显式记账而不是关掉规则。
      # 清单项若已修好却未删除，命令会以 stale 失败，避免豁免长期滞留。
      - name: prompt contract lint
        run: |
          python -m devops_agent.eval prompt-lint \
            --suite eval/suites/devops-core.v3.jsonl \
            --known-issues eval/lint-baseline.json
          python -m devops_agent.eval prompt-lint \
            --suite eval/suites/devops-core.v2.jsonl \
            --known-issues eval/lint-baseline.json

  frontend:
    runs-on: ubuntu-latest
    # npm ci + lint/typecheck/coverage/build；只在 npm 镜像慢时才会接近上限。
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test + coverage
        run: npm run test:coverage
      - name: build
        run: npm run build

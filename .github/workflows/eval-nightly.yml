name: eval-nightly

on:
  schedule:
    # 每天 03:30 UTC（北京时间 11:30），避开白天配额高峰
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: validate suite
        run: python -m devops_agent.eval validate --suite eval/suites/devops-core.v1.jsonl
      - name: run eval with judge
        env:
          DEVOPS_AGENT_API_KEY: ${{ secrets.DEVOPS_AGENT_API_KEY }}
          DEVOPS_AGENT_BASE_URL: ${{ secrets.DEVOPS_AGENT_BASE_URL }}
          DEVOPS_AGENT_MODEL: ${{ secrets.DEVOPS_AGENT_MODEL }}
          DEVOPS_AGENT_JUDGE_MODEL: ${{ secrets.DEVOPS_AGENT_JUDGE_MODEL }}
          DEVOPS_AGENT_EVAL_DB_PATH: workspace/evals/eval.db
        run: |
          python -m devops_agent.eval run \
            --suite eval/suites/devops-core.v1.jsonl \
            --out workspace/evals/nightly \
            --judge
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            workspace/evals/nightly/report.json
            workspace/evals/nightly/report.md
            workspace/evals/nightly/cases.jsonl
          if-no-files-found: warn

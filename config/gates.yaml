# 质量门禁阈值（CI 读取）
quality_gates:
  coverage_fail_under: 80          # % 覆盖率棘轮，未达标则 CI 失败
  complexity_threshold: 10         # 圈复杂度上限
  mutation_score: 70               # % 变异测试得分
  dead_code_min_confidence: 80     # vulture 置信度
  max_lines: 500                   # 单文件行数上限（存量见 config/size-baseline.json）

# 前端门禁阈值（web/ 下的 ESLint / Vitest 读取）
frontend_gates:
  coverage_fail_under: 65          # % 覆盖率棘轮，随测试补齐抬升
  complexity_threshold: 10         # 圈复杂度上限，与后端对齐
  max_lines: 500                   # 单文件行数上限（存量见 config/size-baseline.json）

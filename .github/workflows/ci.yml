name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 行尾门禁：.gitattributes 规定全仓库 LF；二进制文件显示为 none，放行。
      # 任何新文件若是 CRLF 或文件内混用，这里直接拦下，不再靠人工 review 发现。
      - name: line endings (LF only)
        run: |
          bad="$(git ls-files --eol | awk '$1 != "i/lf" && $1 != "i/none" || $2 != "w/lf" && $2 != "w/none"')"
          if [ -n "$bad" ]; then
            echo "::error::以下文件行尾不是 LF："
            echo "$bad"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: type check
        run: mypy src
      - name: quality gates (config/gates.yaml)
        run: python scripts/check_gates.py
      - name: eval suite validate
        run: python -m devops_agent.eval validate --suite eval/suites/devops-core.v2.jsonl
      # 清单必须与题库同步：`sha256` 是 `compare` 判断「同一套题」的依据，
      # 改了 JSONL 却忘了跑 `eval manifest` 会让新旧批次的 delta 无声失效。
      # 比对 JSON 语义而非字节，避免 CRLF/缩进差异造成假红。
      - name: eval manifest in sync
        run: python scripts/check_manifest_sync.py
      # 静态契约检查：工具名闭包 / 占位符机器无关 / 文案承诺=能力矩阵 / 题库自洽 /
      # 断言有效性 / 判卷口径版本 / 断言撞车（S7）/ 档位可达性（S8）。
      # 不跑模型，纯静态，几毫秒；S8 会真跑一次权限引擎。
      # `--known-issues` 列出已接受的存量违规（eval/lint-baseline.json）：
      # 规则对新增用例立刻生效，存量问题显式记账而不是关掉规则。
      # 清单项若已修好却未删除，命令会以 stale 失败，避免豁免长期滞留。
      - name: prompt contract lint
        run: |
          python -m devops_agent.eval prompt-lint \
            --suite eval/suites/devops-core.v2.jsonl \
            --known-issues eval/lint-baseline.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test + coverage
        run: npm run test:coverage
      - name: build
        run: npm run build

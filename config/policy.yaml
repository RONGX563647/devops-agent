# 权限与运行时策略（对应 agentscope.permission / ReActConfig / ModelConfig）
permission:
  # mode 只是「没有档位上下文时」的回落值（脚本、单测直接建引擎时用）。
  # 正常对话由请求里的档位决定，映射关系见 governance/profiles.py 的 MODES：
  #   readonly → explore / workspace → accept_edits / cautious → default
  #   unattended → dont_ask / container → bypass
  mode: dont_ask           # default / accept_edits / explore / bypass / dont_ask

  # 前端默认档位：工作区可写 + 其余命令逐次询问，是「人在会话框前」时的合理默认。
  default_profile: workspace
  # 本部署开放给前端的档位。container 默认不开放 —— 它跳过逐次确认，
  # 只适合本地/一次性环境，要开就显式加进来。
  # 老名字 execute / auto / unrestricted 仍可识别（映射到 workspace / unattended /
  # container），老会话不会因为改名而 403。
  available: [readonly, workspace, cautious, unattended]

  # 「测试/构建命令不问」的白名单。它不再是某个档位的属性，而是编译成
  # `source=project` 的 allow 规则注入到 workspace 及以上档位 —— 也就是
  # 「白名单命令不问」是规则层的事，与打扰程度无关。
  # 框架会把复合命令拆成子命令逐个匹配，所以 "pytest; rm -rf /" 里的 rm
  # 匹配不上任何一条，整条不会被放行。
  # 注意这是「信任这个命令」而不是「验证这次行为」：pytest 会执行 conftest.py，
  # npm run 会执行 package.json 里的脚本 —— 白名单的固有属性，不是漏洞。
  # git add / git commit 按所有者决策不进白名单：改仓库历史值得逐次确认。
  command_allowlist:
    - "pytest:*"
    - "python -m pytest:*"
    - "python -m ruff:*"
    - "python -m mypy:*"
    - "npm run:*"
    - "npm test:*"
    - "npm ci:*"
    - "npm install:*"
    - "npx:*"
    - "pnpm:*"
    - "yarn:*"
    - "make:*"
    - "cargo:*"
    - "go test:*"
    - "go build:*"

  working_directories: []
  allow_rules: []
  # 内置 deny（.git/ / .env / .ssh/ / .aws/ / rm -rf /）在 governance/rules.py 里
  # 无条件装配，不在这里配 —— 之前写成 `source: profile` 只在放开档生效，等于
  # 最需要防护的档位最松。这里留给部署方追加自己的禁止项，例如：
  #   - {tool_name: Bash, rule_content: "docker:*", behavior: deny, scope: container}
  deny_rules: []
  ask_rules: []

react:
  max_iters:
    default: 12
    delivery: 16

model:
  max_retries: 3

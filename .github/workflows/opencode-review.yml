name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['web/**', 'docs/**', '**/*.md', '**/package-lock.json']

# 同一 PR 连续 push 时取消旧 run，避免状态 issue 读改写竞态与重复烧 token
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 只审同一仓库的非草稿 PR：fork PR 的 GITHUB_TOKEN 是只读的，无法写状态
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      id-token: write        # 官方 action 要求
      contents: read         # checkout + git diff
      pull-requests: write   # 把审查结论评论回 PR
      issues: write          # 防循环状态 issue
    steps:
      # 直接 checkout PR head，使 HEAD 与状态里存的 head.sha 一致（默认 checkout 是 merge commit）
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # 每个 PR 独立 issue 存状态：读状态 → 算增量 base → 判轮次（round >= 3 或 SHA 未变则跳过）
      - name: Resolve review state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          def gh(*args: str) -> str:
              proc = subprocess.run(["gh", *args], capture_output=True, text=True)
              if proc.returncode:
                  raise RuntimeError(f"gh {' '.join(args)} failed: {proc.stderr.strip()}")
              return proc.stdout.strip()

          pr = os.environ["PR_NUMBER"]
          label = "opencode-review-state"
          title = f"[bot] OpenCode review state PR #{pr}"
          subprocess.run(
              ["gh", "label", "create", label, "--color", "0E8A16",
               "--description", "OpenCode review state"],
              capture_output=True, text=True, check=False,
          )

          # 按标题精确匹配本 PR 的 issue，避免多个 PR 共用一个 body 造成读改写竞态
          listing = gh("issue", "list", "--state", "all", "--label", label,
                       "--limit", "1000", "--json", "number,title")
          issue = ""
          for row in json.loads(listing or "[]"):
              if row.get("title") == title:
                  issue = str(row["number"])
                  break
          if not issue:
              # 标签搜索可能有索引延迟，直接解析 create 返回的 URL
              url = gh("issue", "create", "--title", title, "--body", "{}", "--label", label)
              match = re.search(r"/issues/(\d+)", url)
              issue = match.group(1) if match else ""
          if not issue:
              raise RuntimeError("cannot locate or create review state issue")

          body = gh("issue", "view", issue, "--json", "body", "--jq", ".body")
          try:
              state = json.loads(body)
          except (ValueError, TypeError):
              state = {}
          if not isinstance(state, dict):
              state = {}

          head = os.environ["HEAD_SHA"]
          default_base = os.environ["BASE_SHA"]
          reviewed = str(state.get("sha", ""))
          rounds = int(state.get("round", 0))
          skip = reviewed == head or rounds >= 3
          base = reviewed or default_base

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"base={base}\n")
              out.write(f"round={rounds if skip else rounds + 1}\n")
              out.write(f"skip={'true' if skip else 'false'}\n")
              out.write(f"issue={issue}\n")
          PY

      # 归一化上下文：diff + 调用方代码，一次打包进 prompt
      - name: Build review context
        id: ctx
        if: steps.state.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ steps.state.outputs.base }}
        run: |
          {
            echo 'context<<OPENCODE_CTX_EOF_7f3a'
            python scripts/build_review_context.py "$BASE_SHA"
            echo OPENCODE_CTX_EOF_7f3a
          } >> "$GITHUB_OUTPUT"

      - name: Run opencode review
        if: steps.state.outputs.skip != 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_REVIEW_KEY: ${{ secrets.DEVOPS_AGENT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: dashscope/qwen3.8-flash
          agent: reviewer
          use_github_token: true
          prompt: |
            审查以下代码改动。列出所有确认的问题，每条标注 file:line，按严重度从高到低排序。
            跳过风格/命名/文档建议，不报推测性问题。无问题只回复 LGTM 和 FINDINGS_TOTAL: 0。
            末尾单独一行输出 FINDINGS_TOTAL: <问题总数>。

            ---BEGIN CONTEXT---
            ${{ steps.ctx.outputs.context }}
            ---END CONTEXT---

      # 审查后把「已审 SHA + 轮次」写回状态 issue，作为下次增量 base 与防循环依据
      - name: Save review state
        if: steps.state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.state.outputs.issue }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROUND: ${{ steps.state.outputs.round }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          def gh(*args: str, stdin: str | None = None) -> str:
              return subprocess.run(
                  ["gh", *args], input=stdin, capture_output=True, text=True, check=True
              ).stdout.strip()

          issue = os.environ["ISSUE"]
          state = {
              "sha": os.environ["HEAD_SHA"],
              "round": int(os.environ["ROUND"]),
          }
          gh("issue", "edit", issue, "--body-file", "-",
             stdin=json.dumps(state, ensure_ascii=False))
          PY

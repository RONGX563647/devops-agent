name: eval-nightly

on:
  schedule:
    # 每天 03:30 UTC（北京时间 11:30），避开白天配额高峰
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: validate suite
        run: python -m devops_agent.eval validate --suite eval/suites/devops-core.v2.jsonl
      - name: run eval with judge
        env:
          DEVOPS_AGENT_API_KEY: ${{ secrets.DEVOPS_AGENT_API_KEY }}
          DEVOPS_AGENT_BASE_URL: ${{ secrets.DEVOPS_AGENT_BASE_URL }}
          DEVOPS_AGENT_MODEL: ${{ secrets.DEVOPS_AGENT_MODEL }}
          DEVOPS_AGENT_JUDGE_MODEL: ${{ secrets.DEVOPS_AGENT_JUDGE_MODEL }}
          DEVOPS_AGENT_EVAL_DB_PATH: workspace/evals/eval.db
        run: |
          # 基线是可选的：仓库里没有 workspace/evals/baseline.json 时只按绝对阈值判门禁。
          # 想开启回归判定，把一个 report.json 放到该路径即可 —— 此时 verdict 会由
          # compare 决定，可比性不成立（suite_sha / grader_version / judge_model 变了）
          # 会退回 not_comparable，而不是把「换了个实验」当成「退步」。
          if [ -f workspace/evals/baseline.json ]; then
            BASE_ARGS="--baseline workspace/evals/baseline.json"
          else
            echo "未提供基线，跳过对比（只有绝对阈值生效）"
            BASE_ARGS=""
          fi
          # 退出码语义：fail 与 warn 都让 nightly 变红。
          # - fail：硬失败或门禁未达；
          # - warn：与基线比退化超过精度上限（旧版只 warn 退 0，-20pp 回归会被忽略）；
          # - insufficient：题库未达门禁量，属正常状态，不红。
          #
          # `--judge-scope all`：裁判覆盖所有配了裁判的用例。默认值就是 all，
          # 这里显式写出来，防止将来改默认值时 nightly 悄悄变成有偏口径。
          python -m devops_agent.eval run \
            --suite eval/suites/devops-core.v2.jsonl \
            --out workspace/evals/nightly \
            --judge \
            --judge-scope all \
            $BASE_ARGS
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            workspace/evals/nightly/report.json
            workspace/evals/nightly/report.md
            workspace/evals/nightly/cases.jsonl
          if-no-files-found: warn

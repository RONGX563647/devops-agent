# 输入管线的抓取与体积上限（对应 src/devops_agent/config.py 的 InputPolicy）。
#
# 这些是「部署策略」而不是域知识：不同机器、不同网络环境需要不同的超时与体积。
# 改这里不需要动代码；缺文件时回落 InputPolicy 的字段默认值，两边由
# tests/unit/test_input_pipeline.py 的对账用例钉住。
input:
  # 单条远程抓取超时（秒）
  fetch_timeout_seconds: 5.0
  # 单条远程响应体上限（字节），超出部分截断
  fetch_max_bytes: 524288          # 512 KiB
  # 单个本地引用文件最多读取的字节数
  max_file_bytes: 262144           # 256 KiB
  # 单条输入最多登记的引用条数，防止一条消息把预算吃光
  max_references: 5
  # 重定向最多跟几跳（每跳都会重新校验目标地址）
  max_redirects: 3
  # 是否允许抓取内网 / 回环 / 链路本地地址。
  # 默认 false：开启远程抓取后，服务端不该替谁去访问元数据服务（169.254.169.254）
  # 或本机端口（127.0.0.1）。确需抓内网时再显式打开。
  allow_private_addresses: false
  # 允许访问的端口：只放 80/443，避免把公网上的 Redis / ES 当网页抓
  allowed_ports: [80, 443]
  # 域名白/黑名单：留空表示不限制（白名单非空时即「只允许这些」）
  allowed_hosts: []
  denied_hosts: []

  # --- 内容安全裁剪（SPEC-0012）----------------------------------------
  # 单条材料裁剪后的字符上限；超出时按 head_ratio 保留头尾
  per_url_chars: 8000
  # 判「内容不足（thin）」的阈值
  min_chars: 400
  # 抓到多少字就算「够用」，可以提前停止
  min_total_chars: 1200
  # 一轮材料总字符上限
  total_chars: 24000
  # 一轮预抓取的总时间预算（毫秒）
  total_ms: 8000
  # 裁剪时保留头部的比例（其余给尾部：网页结论常在尾部）
  head_ratio: 0.7
  # 是否扫描「疑似指令注入」（只标记不删除）
  injection_scan: true
  # 是否给网络材料加 <<untrusted-web>> 边界标记
  wrap_untrusted: true

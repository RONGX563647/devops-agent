# 工作区（SPEC-0021）—— 一工作区一代码库。
# enabled=false 时 /api/workspaces 返回 404，运行链路完全走旧路径；本仓库默认开启。
workspaces:
  enabled: true
  # 受管克隆根；留空表示仓库根下的 workspace/workspaces（已 gitignore）
  root: ""
  # 本地目录导入是高风险入口：无容器隔离时它等于把宿主目录交给工具。
  # 这里只负责开闸；白名单是本机绝对路径，不入库 —— 写进 config.db（界面「工作区」域）
  # 或 DEVOPS_AGENT_WORKSPACE_LOCAL_ROOTS。白名单为空时本地导入一律拒绝（不是「全放开」）。
  allow_local_import: true
  allowed_local_roots: []
  allow_git_import: true
  git_clone_timeout_sec: 120
  max_workspaces: 10
  # 删除受管克隆时要求工作区干净；脏目录先出 patch 或 409
  require_clean_on_delete: true
  default_profile: workspace

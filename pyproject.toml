[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-agent"
version = "0.1.0"
description = "DevOps agent built on AgentScope 2.x (delivery / schedule / bug localization)"
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # 密钥保险箱：Fernet 对称加密（AES128-CBC + HMAC），不手搓加密原语
    "cryptography>=42.0",
    # FastAPI 解析 multipart/form-data 的必需依赖，缺了 POST /api/attachments 直接 500
    "python-multipart>=0.0.9",
    # 联网检索工具的出站客户端（tools/web_search.py）。显式声明而不是蹭
    # agentscope 的间接依赖：间接依赖随上游升级消失时，报错会出现在调用点上。
    "httpx>=0.27",
]

[project.optional-dependencies]
# PDF 附件抽正文：没装时上传 PDF 会明确报「缺少 pypdf」，不影响其他格式
parse = ["pypdf>=4.0"]
# 外部内容的安全裁剪（SPEC-0012）：净化用 nh3、正文抽取用 trafilatura；
# 没装时退化为标签剥离，并由 /health 与阶段详情如实上报
sanitize = ["nh3>=0.2", "trafilatura>=1.8"]
# OpenJudge 评测基准：第三方包只在 devops_agent/openjudge/ 内 import，保持可选依赖隔离
openjudge = ["py-openjudge==0.2.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "vulture>=2.11",
    "radon>=6.0",
    "import-linter>=2.0",
    "mutmut>=3.0",
    "types-PyYAML>=6.0",
    # CI 覆盖真实净化路径：运行时仍是 optional extra，测试环境必装
    "nh3>=0.2",
    "trafilatura>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# py-openjudge 未提供 py.typed，裁判模块只能当无类型依赖用；其余仍然严格检查。
[[tool.mypy.overrides]]
module = ["openjudge.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["devops_agent"]
branch = true

[tool.coverage.report]
show_missing = true
# 阈值唯一来源是 config/gates.yaml（由 scripts/check_gates.py 读取并注入 --cov-fail-under）
